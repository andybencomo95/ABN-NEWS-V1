version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abnnews
      POSTGRES_USER: abnnews
      POSTGRES_PASSWORD: abnnews
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abnnews"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://abnnews:abnnews@postgres:5432/abnnews?sslmode=disable
      REDIS_ADDR: redis:6379
      PORT: "8080"
      MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  poller:
    build:
      context: .
      dockerfile: Dockerfile.poller
    environment:
      DATABASE_URL: postgres://abnnews:abnnews@postgres:5432/abnnews?sslmode=disable
      MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
